name: Koyeb recovery staging checks
on:
  push:
    branches: [koyeb-recovery-prep]
  pull_request:
    branches: [koyeb-recovery-prep]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: |
          for source in *.mjs public/*.js; do
            node --check "$source"
          done
      - run: node --test test/recovery.test.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t evening-wire-koyeb-staging .
