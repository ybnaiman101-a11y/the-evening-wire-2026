name: Read-only public domain health, security and election results
on:
  push:
    branches: [public-site-audit-2026]
permissions:
  contents: read
jobs:
  inspect-public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed site from outside the owner's network
        run: node test/public-site-audit.mjs
