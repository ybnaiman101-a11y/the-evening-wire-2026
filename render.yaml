# THE EVENING WIRE — existing Render web service; keep its region/plan intact.
# Database credentials are resolved by Render during a Blueprint sync, never committed.
services:
  - type: web
    name: the-evening-wire-2026
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    repo: https://github.com/ybnaiman101-a11y/the-evening-wire-2026
    branch: main
    buildCommand: yarn
    startCommand: yarn start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: POLL_INTERVAL_MS
        value: '30000'
      - key: DATABASE_URL
        fromDatabase:
          name: evening-wire-community
          property: connectionString
