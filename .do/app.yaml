# DigitalOcean App Platform recovery configuration.
# Prepared only. DO NOT launch publicly until the prior phishing warning and
# hosting restriction have been investigated and cleared.
# Preserve the existing Node.js web service and all existing public assets.
name: evening-wire-recovery
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: evening-wire-web
    environment_slug: node-js
    github:
      repo: ybnaiman101-a11y/the-evening-wire-2026
      branch: digitalocean-recovery-prep
      deploy_on_push: false
    source_dir: /
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
      http_path: /health
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
        type: GENERAL
      - key: POLL_INTERVAL_MS
        value: "30000"
        scope: RUN_TIME
        type: GENERAL
# Add the managed PostgreSQL cluster and secrets privately in DigitalOcean.
# Do not put DATABASE_URL, EW_ADMIN_PASSWORD_SHA256, AP_ELECTIONS_API_KEY,
# REACTION_ADMIN_TOKEN, or database passwords in git.
